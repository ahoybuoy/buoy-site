name = "buoy-site"
compatibility_date = "2025-01-05"
compatibility_flags = ["nodejs_compat_v2"]
pages_build_output_dir = "dist"

# Environment variables (set via Cloudflare dashboard or wrangler secret)
# MAILGUN_API_KEY = "your-mailgun-api-key"
# MAILGUN_DOMAIN = "mg.buoy.design"
# SUPPORT_EMAIL = "support@buoy.design"

[vars]
SUPPORT_EMAIL = "support@buoy.design"

[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "buoy-downloads"

[[kv_namespaces]]
binding = "COUNTERS"
id = "50982c09944e4efc8182957e708da003"

# Analytics Engine - shared product analytics dataset (same as buoy-cloud)
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "buoy_events"

# Buoy's email list lives in the platform database (table email_list,
# buoy-cloud/migrations/0048_email_list.sql).
[[d1_databases]]
binding = "DB"
database_name = "buoy_platform"
database_id = "af1e1cd5-6300-4f9f-9d3b-0126a49a972b"
