name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Called by refresh-reports.yml: pushes made with GITHUB_TOKEN do not
  # trigger push workflows, so the refresh deploys through this instead.
  workflow_call:
    inputs:
      ref:
        type: string
        default: main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Name the branch: checking out a SHA leaves git detached, and
          # without --branch Pages files the upload as a preview ("head"),
          # not production.
          command: pages deploy dist --project-name=buoy-site --branch=main
